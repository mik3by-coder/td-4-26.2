<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ТД-4-26 · Расписание</title>
<style>
:root{--bg:#151416;--tx:#ececee;--mu:#9a9ca3;--ac:#9fc0cb;--line:rgba(255,255,255,.14);--g1:rgba(255,255,255,.04);--g2:rgba(160,190,200,.15);--gl:rgba(255,255,255,.1);--dock:rgba(30,30,33,.72);--warn:#e5484d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e8eaed;--tx:#1b1c1f;--mu:#5d6168;--ac:#365965;--line:rgba(0,0,0,.14);--g1:rgba(255,255,255,.6);--g2:rgba(255,255,255,.95);--gl:rgba(0,0,0,.07);--dock:rgba(245,246,248,.8);color-scheme:light}}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 110px}
.card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(90deg,var(--g1),var(--g2) 50%,var(--g1));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ttl{font-size:24px;font-weight:700;letter-spacing:.3px}
.sub{color:var(--mu);font-size:13px}
.seg{display:flex;padding:3px;border-radius:999px}
.seg button{padding:7px 12px;border-radius:999px;font-size:13px;color:var(--mu)}
.seg button.on{background:var(--gl);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.warn{border:1px solid var(--warn);background:rgba(229,72,77,.14);border-radius:20px;padding:12px 16px;margin-bottom:12px}
.warn b{display:block;color:var(--warn);font-size:16px}
.tmr{padding:16px 18px;margin-bottom:14px}
.tmr small{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.tc{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0}
.ts{color:var(--mu);font-size:13px;min-height:18px}
.bar{height:4px;border-radius:4px;background:var(--gl);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width 1s linear}
.wn{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.wn>button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);font-size:20px}
.wn div{text-align:center}.wn b{display:block}.wn small{color:var(--mu)}
.wn .tdy{color:var(--ac);font-size:12px;margin-top:2px}
.ch{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.ch button{padding:8px 0;border-radius:16px;border:1px solid var(--line);font-size:11px;color:var(--mu)}
.ch button b{display:block;font-size:16px;color:var(--tx)}
.ch button.td{border-color:var(--ac)}
.ch button.on{background:var(--gl);box-shadow:inset 0 0 0 1px var(--ac)}
.les{display:grid;grid-template-columns:58px 1fr 44px;gap:12px;align-items:center;padding:12px 14px;margin-top:10px;border-radius:22px}
.les.cur{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.les.sk{border-color:rgba(229,72,77,.55)}.les.sk .nm{text-decoration:line-through;text-decoration-color:var(--warn)}
.tm{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}.tm b{display:block;font-size:17px;color:var(--tx)}.tm i{display:block;font-style:normal;margin-top:2px}
.nm{font-weight:600}.mt{color:var(--mu);font-size:13px;margin-top:2px}.rm{color:var(--ac);font-size:13px;margin-top:2px}
.kd{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:11px;color:var(--ac);margin-right:6px}
.x{width:40px;height:40px;border-radius:13px;border:1.5px solid var(--line);font-size:20px;line-height:1;color:var(--warn)}
.x.on{border-color:var(--warn);background:rgba(229,72,77,.18)}
.empty{text-align:center;color:var(--mu);padding:36px 0}
.tw{display:flex;justify-content:center;margin:6px 0 14px}
.tank{position:relative;width:170px;height:230px;border-radius:36px;border:1.5px solid var(--line);overflow:hidden;background:linear-gradient(180deg,var(--g1),var(--g2))}
.lo{--lq:#4d9fb0}.mid{--lq:#d29a3c}.hi{--lq:#e0484d}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--lq);transition:height .9s cubic-bezier(.2,.8,.2,1),background .5s}
.fill::before{content:"";position:absolute;left:0;right:0;top:-9px;height:18px;background:radial-gradient(circle at 10px 18px,var(--lq) 9px,transparent 9.5px) 0 0/20px 18px repeat-x;animation:rip 2.4s linear infinite}
@keyframes rip{to{background-position:20px 0}}
.mk{position:absolute;left:0;right:0;top:8.33%;border-top:1px dashed var(--warn);font-size:10px;color:var(--warn);text-align:right;padding-right:8px}
.val{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:42px;font-weight:700}
.val small{display:block;font-size:13px;font-weight:400;color:var(--mu)}
.st{text-align:center;color:var(--mu)}.st b{color:var(--tx)}
.sqs{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:16px 0}
.sq{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--g1)}
.sq.on{border-color:rgba(229,72,77,.6);background:linear-gradient(to top right,transparent calc(50% - 1px),var(--warn) calc(50% - 1px),var(--warn) calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(to bottom right,transparent calc(50% - 1px),var(--warn) calc(50% - 1px),var(--warn) calc(50% + 1px),transparent calc(50% + 1px)),var(--g1)}
.sl{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 16px;margin-top:8px;border-radius:18px;font-size:14px}
.sl span{color:var(--mu);display:block;font-size:12px}
.sl button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);color:var(--mu)}
h3{margin:18px 4px 0;font-size:14px;color:var(--mu);font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:5}
.pill{pointer-events:auto;display:flex;gap:6px;padding:6px;border-radius:999px;border:1px solid var(--line);background:var(--dock);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.pill button{display:flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;color:var(--mu);font-size:14px}
.pill button.on{background:var(--gl);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.pill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <div><div class="ttl">ТД-4-26</div><div class="sub" id="wk"></div></div>
  <div class="seg card" id="seg"><button data-g="1">Подгр. 1</button><button data-g="2">Подгр. 2</button></div>
 </div>
 <section id="ps">
  <div id="bn"></div>
  <div class="tmr card"><small id="tl">—</small><div class="tc" id="tc">—</div><div class="ts" id="tsb"></div><div class="bar"><i id="tb"></i></div></div>
  <div id="cl"></div><div id="ll"></div>
 </section>
 <section id="pk" hidden>
  <div class="tw"><div class="tank lo" id="tk"><div class="fill" id="fl"></div><div class="mk">66</div><div class="val"><div id="hv">0</div><small>из 72 ч</small></div></div></div>
  <div class="st" id="st"></div>
  <div class="sqs" id="sq"></div>
  <h3>Отмеченные пары</h3><div id="sli"></div>
 </section>
 <noscript>Нужен JavaScript.</noscript>
</div>
<div class="dock"><nav class="pill">
 <button data-t="s"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Расписание</button>
 <button data-t="k"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/></svg>Пропуски</button>
</nav></div>
<script>
(function(){
var DAY=864e5,START=Date.UTC(2026,7,31),LIM=72,WARN=66,DUR=85;
var ST=[540,635,730,845,940];
var WD=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"],MN=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
var IY1="Иностранный язык первый",IY2="Иностранный язык второй",PH="Физическая культура",PHIL="Философия",IST="История белорусской государственности",MATH="Высшая математика",TAM="Основы таможенного дела",IT="Информационные технологии";
/* [пара, неделя b=обе/u=верхняя/l=нижняя, подгруппа 0=все, предмет, вид, преподаватель, корпус/аудитория] */
var D=[
[[1,"b",1,IY2,"","Королюк М.А.","508"],[1,"b",2,IY2,"","Копчак Е.В.","423"],
 [2,"b",1,IY1,"","Обуховская О.А. (419), Войтович К.А. (421)",""],[2,"b",2,IY1,"","Колб Е.С. (414), Копчак Е.В. (417)",""],
 [3,"b",0,PHIL,"лк","Криштовчук И.В.","443"],[4,"u",0,PHIL,"сем","Криштовчук И.В.","416"]],
[[1,"b",0,PH,"","",""],[2,"b",0,IST,"лк","Восович С.М.","2/112"],
 [3,"b",1,IY2,"","Королюк М.А.","423"],[3,"b",2,IY2,"","Федорович Н.Н. (514), Копчак Е.В. (519)",""],
 [4,"b",0,MATH,"лк","Копайцева Т.В.","511"],[5,"b",0,"Кураторский час","","Приймачук И.В.",""]],
[[1,"b",0,IY1,"","Колб Е.С.","508"],
 [2,"b",1,IY1,"","Обуховская О.А. (419), Войтович К.А. (516)",""],[2,"b",2,IY1,"","Колб Е.С. (508), Копчак Е.В. (512а)",""],
 [3,"b",1,IY2,"","Королюк М.А. (112), Копчак Е.В. (140)",""],[3,"b",2,IY2,"","Федорович Н.Н.","115"],
 [4,"b",0,IY2,"","Федорович Н.Н.","503"]],
[[1,"b",0,"Белорусский язык (проф. лексика)","пр","Захарчук Т.Д.","107"],[2,"b",0,PH,"","",""],
 [3,"b",1,IY1,"","Обуховская О.А. (419), Войтович К.А. (5/311)",""],[3,"b",2,IY1,"","Копчак Е.В.","503"],
 [4,"l",0,IY2,"","Копчак Е.В.","423"]],
[[1,"b",0,TAM,"лк","Крамаренко А.К.","2/401а"],
 [2,"u",0,IT,"лк","Сидак С.В.","301"],[2,"l",0,TAM,"пр","Крамаренко А.К.","5/308"],
 [3,"u",0,"Основы научно-исследовательской работы студента","лк","Приймачук И.В.","329"],[3,"l",0,IST,"сем","Карпович О.В.","2/105"],
 [4,"b",0,MATH,"пр","Копайцева Т.В.","507"]],
[[1,"u",1,IT,"","Сидак С.В.","326"],[1,"l",2,IT,"","Сидак С.В.","326"],[2,"u",1,IT,"","Сидак С.В.","326"],[2,"l",2,IT,"","Сидак С.В.","326"]]
];
function $(i){return document.getElementById(i)}
function ld(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sv(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function pj(s){try{var o=JSON.parse(s);return o&&typeof o=="object"?o:{}}catch(e){return {}}}
function pad(n){return n<10?"0"+n:""+n}
function nowMs(){return Date.now()+3*36e5}
function today(){var n=nowMs();return n-n%DAY}
function dow(d){return (new Date(d).getUTCDay()+6)%7}
function wt(d){var m=d-dow(d)*DAY,n=Math.round((m-START)/(7*DAY));return ((n%2)+2)%2==0?"u":"l"}
function wname(d){return wt(d)=="u"?"Верхняя":"Нижняя"}
function iso(d){return new Date(d).toISOString().slice(0,10)}
function dfm(d){var x=new Date(d);return x.getUTCDate()+" "+MN[x.getUTCMonth()]}
function fm(m){return Math.floor(m/60)+":"+pad(m%60)}
function room(r){if(!r)return "";var m=/^(\d+)\/(.+)$/.exec(r);return m?"Корпус "+m[1]+" · ауд. "+m[2]:"ауд. "+r}
function fmt(ms){var s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);s%=60;return (d?d+" д ":"")+((d||h)?h+":"+pad(m):pad(m))+":"+pad(s)}
var sg=+ld("td_sg")===2?2:1,sk=pj(ld("td_sk")),tab="s",sel=today(),lastMin=-1;
function lessons(d){var w=dow(d),t=wt(d);if(w>5)return [];return D[w].filter(function(e){return (e[1]=="b"||e[1]==t)&&(e[2]==0||e[2]==sg)}).sort(function(a,b){return a[0]-b[0]})}
function hours(){return Object.keys(sk).length*2}
function drawTop(){
 $("wk").textContent="Сейчас "+wname(today()).toLowerCase()+" неделя";
 var bs=document.querySelectorAll("#seg button");for(var i=0;i<bs.length;i++)bs[i].className=(+bs[i].getAttribute("data-g")==sg)?"on":"";
 var ts=document.querySelectorAll(".pill button");for(i=0;i<ts.length;i++)ts[i].className=ts[i].getAttribute("data-t")==tab?"on":"";
 $("ps").hidden=tab!="s";$("pk").hidden=tab!="k";
 var h=hours(),l=Math.max(0,LIM-h);
 $("bn").innerHTML=h>=WARN?'<div class="warn"><b>'+(h>=LIM?"Лимит пропусков исчерпан":"Пора браться за ум")+'</b>Пропущено '+h+' из '+LIM+' ч'+(h<LIM?" — осталось "+l+" ч ("+l/2+" пар)":"")+'</div>':"";
}
function drawSched(){
 var mon=sel-dow(sel)*DAY,td=today(),h='<div class="wn"><button data-w="-1" aria-label="Предыдущая неделя">‹</button><div><b>'+wname(sel)+' неделя</b><small>'+dfm(mon)+" – "+dfm(mon+6*DAY)+'</small>'+(sel!=td?'<div><button class="tdy" data-today="1">К сегодняшнему дню</button></div>':"")+'</div><button data-w="1" aria-label="Следующая неделя">›</button></div><div class="ch">';
 for(var i=0;i<7;i++){var d=mon+i*DAY;h+='<button data-d="'+d+'" class="'+(d==td?"td ":"")+(d==sel?"on":"")+'">'+WD[i]+'<b>'+new Date(d).getUTCDate()+'</b></button>'}
 $("cl").innerHTML=h+"</div>";
 var L=lessons(sel),n=nowMs(),o="";
 if(!L.length)o='<div class="empty">'+(dow(sel)==6?"Воскресенье — выходной":"Занятий нет")+'</div>';
 L.forEach(function(l){var s=ST[l[0]-1],k=iso(sel)+"|"+l[0],on=!!sk[k],ts=sel+s*6e4,cur=n>=ts&&n<ts+DUR*6e4,r=room(l[6]);
  o+='<div class="les card'+(on?" sk":"")+(cur?" cur":"")+'"><div class="tm"><b>'+fm(s)+'</b>'+fm(s+DUR)+'<i>'+l[0]+' пара</i></div><div><div class="nm">'+l[3]+'</div><div class="mt">'+(l[4]?'<span class="kd">'+l[4]+'</span>':"")+l[5]+'</div>'+(r?'<div class="rm">'+r+'</div>':"")+'</div><button class="x'+(on?" on":"")+'" data-k="'+k+'" data-n="'+l[3].slice(0,40)+'" aria-pressed="'+on+'" aria-label="Пропуск без уважительной причины">'+(on?"✕":"")+'</button></div>'});
 $("ll").innerHTML=o;
}
function drawSkips(){
 var h=hours(),l=Math.max(0,LIM-h),p=Math.min(100,h/LIM*100),tk=$("tk");
 tk.className="tank "+(h>=WARN?"hi":h>=48?"mid":"lo");
 $("fl").style.height=p+"%";$("fl").style.visibility=h?"visible":"hidden";
 $("hv").textContent=h;
 $("st").innerHTML="Осталось <b>"+l+" ч</b> ("+l/2+" пар) · каждая отметка = 2 ч";
 var q="";for(var i=0;i<LIM;i++)q+='<div class="sq'+(i<h?" on":"")+'"></div>';$("sq").innerHTML=q;
 var ks=Object.keys(sk).sort().reverse(),o="";
 ks.forEach(function(k){var a=k.split("|"),d=Date.parse(a[0]+"T00:00:00Z");o+='<div class="sl card"><div>'+sk[k]+'<span>'+WD[dow(d)]+", "+dfm(d)+" · "+a[1]+" пара · 2 ч</span></div><button data-r=\""+k+'" aria-label="Убрать">×</button></div>'});
 $("sli").innerHTML=o||'<div class="empty">Пропусков нет</div>';
}
function draw(){drawTop();if(tab=="s")drawSched();else drawSkips()}
function tick(){
 var n=nowMs(),t0=n-n%DAY,up=null,passed=false,i,j,L,s,e,lab,cd,sub="",pct=0;
 for(i=0;i<15&&!up;i++){L=lessons(t0+i*DAY);for(j=0;j<L.length;j++){s=t0+i*DAY+ST[L[j][0]-1]*6e4;e=s+DUR*6e4;if(i==0&&e<=n)passed=true;if(e>n){up={s:s,e:e,l:L[j],i:i};break}}}
 if(!up){lab="Занятий не найдено";cd="—"}
 else{var l=up.l,b1=up.s+40*6e4,b2=up.s+45*6e4,r=room(l[6]);sub=l[0]+" пара · "+l[3]+(r?" · "+r:"");
  if(n<up.s){lab=up.i==0?(passed?"Перемена · до начала "+l[0]+"-й пары":"До начала "+l[0]+"-й пары"):"Следующая пара · "+WD[dow(t0+up.i*DAY)]+", "+fm(ST[l[0]-1]);cd=fmt(up.s-n)}
  else{pct=(n-up.s)/(up.e-up.s)*100;if(n<b1){lab="Идёт пара · до перерыва";cd=fmt(b1-n)}else if(n<b2){lab="Перерыв · до продолжения";cd=fmt(b2-n)}else{lab="Идёт пара · до конца";cd=fmt(up.e-n)}}}
 $("tl").textContent=lab;$("tc").textContent=cd;$("tsb").textContent=sub;$("tb").style.width=pct+"%";
 var mi=Math.floor(n/6e4);if(mi!=lastMin){lastMin=mi;draw()}
}
document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-k],[data-t],[data-g],[data-d],[data-w],[data-r],[data-today]");if(!t)return;
 if(t.hasAttribute("data-k")){var k=t.getAttribute("data-k");if(sk[k])delete sk[k];else sk[k]=t.getAttribute("data-n");sv("td_sk",JSON.stringify(sk))}
 else if(t.hasAttribute("data-r")){delete sk[t.getAttribute("data-r")];sv("td_sk",JSON.stringify(sk))}
 else if(t.hasAttribute("data-t"))tab=t.getAttribute("data-t");
 else if(t.hasAttribute("data-g")){sg=+t.getAttribute("data-g");sv("td_sg",sg)}
 else if(t.hasAttribute("data-d"))sel=+t.getAttribute("data-d");
 else if(t.hasAttribute("data-w"))sel+=(+t.getAttribute("data-w"))*7*DAY;
 else if(t.hasAttribute("data-today"))sel=today();
 draw();tick();
});
draw();tick();setInterval(tick,1000);
})();
</script>
</body>
</html>
